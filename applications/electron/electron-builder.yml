appId: dev.ai1.app
productName: AI1
electronVersion: 42.11.8
asar: false
npmRebuild: false
afterPack: ./scripts/distribution-notices.cjs
directories:
  output: dist
files:
  - package.json
  - scripts
  - lib
  - src-gen
  - from: plugins
    to: plugins
    filter:
      - "**/*"
      - "!**/*.map"
  - resources
  - "!**/*.map"
  - "!**/node_modules/fast-uri/benchmark{,/**/*}"
mac:
  icon: resources/branding/AI1.icns
  target:
    - target: dir
      arch:
        - arm64
  identity: null
  category: public.app-category.developer-tools
